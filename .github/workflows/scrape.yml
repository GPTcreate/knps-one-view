name: Scrape KNPS Official Live Status

on:
  schedule:
    # 매 15분마다 국립공원 실시간 잔여석 자동 수집 (0원 무료 Cron)
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  scrape-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Real KNPS Scraper
        run: |
          python scraper_real.py

      - name: Commit and Push Updated status.json
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add status.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: update KNPS nationwide slots [skip ci]" && git push)
